name: nuni
description: "NUNI (Never Up, Never In): collaborative street golf session scoring PWA."
publish_to: "none"

# Shown in settings and compared against version.json for the update banner (plan 11).
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  crop_your_image: ^2.0.0
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.2
  go_router: ^18.0.1
  http: ^1.5.0
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  package_info_plus: ^9.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.7
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  # Pure-Dart client for tool/migrate_lsgscores.dart (plan 13), already
  # resolved transitively through supabase_flutter.
  supabase: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Phosphor Icons (MIT, phosphoricons.com), vendored directly: the
    # `phosphor_flutter` package subclasses IconData, which current Flutter
    # forbids (IconData is a `final class`) -- see lib/core/theme/phosphor_icons.dart.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    # Plus Jakarta Sans (OFL, github.com/tokotype/PlusJakartaSans): the app's
    # only text font (rebrand 2026-09-23), bundled so it works offline.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
