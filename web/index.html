<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NUNI (Never Up, Never In) : le scoring de street golf entre amis. Sessions en direct, classements, championnat et historique.">
  <!-- Private app for a group of players: shareable (link previews below) but
       kept out of search results. robots.txt allows crawling so that this tag
       and the preview tags can be read. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Link previews (WhatsApp, Messenger, Slack, iMessage...). Absolute URLs:
       previewers do not resolve relative paths. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NUNI">
  <meta property="og:title" content="NUNI — Never Up, Never In">
  <meta property="og:description" content="Le scoring de street golf entre amis : rejoins la session et saisis tes coups en direct.">
  <meta property="og:url" content="https://nuni.centuryspine.org/">
  <meta property="og:image" content="https://nuni.centuryspine.org/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo NUNI et devise Never Up, Never In">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:locale:alternate" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F4F5FA">
  <meta name="apple-mobile-web-app-title" content="NUNI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NUNI — Never Up, Never In</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
