# Minimal CI (Q17): one job, every push. The Vercel deploy steps are appended in plan 11.
name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get

      - run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze --fatal-infos

      - run: flutter test

      # Secrets are empty until plan 11 registers them; the build still succeeds.
      - name: Write env/prod.json from secrets
        run: |
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env/prod.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # --no-web-resources-cdn: CanvasKit served from the site, not from Google (Q22).
      - run: flutter build web --release --no-web-resources-cdn --dart-define-from-file=env/prod.json
